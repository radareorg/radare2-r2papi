name: TypeScript

on:
  push:
  pull_request:

env:
  R2_VERSION: 6.2.6

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript

    steps:
    - uses: actions/checkout@v4

    - name: Install radare2 ${{ env.R2_VERSION }}
      run: |
        curl -sSL -o /tmp/radare2.deb "https://github.com/radareorg/radare2/releases/download/${R2_VERSION}/radare2_${R2_VERSION}_amd64.deb"
        sudo dpkg -i /tmp/radare2.deb || sudo apt-get install -f -y
        r2 -v
      working-directory: .

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: typescript/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Test (lint + build + r2 smoke)
      run: npm test

    - name: Build r2 plugin bundle
      run: make one

    - name: Pack dry-run (guards the published file list)
      run: |
        make build
        cp -f README.md package.json package-lock.json build/
        cd build && npm pack --dry-run 2>&1 | tee /tmp/pack.txt
        grep -q "dist/index.js" /tmp/pack.txt
        grep -q "r2papi.r2.js" /tmp/pack.txt

    - name: Make documentation
      run: make doc
      working-directory: typescript

    - uses: actions/upload-artifact@v4
      with:
        name: docs.zip
        path: typescript/docs.zip
